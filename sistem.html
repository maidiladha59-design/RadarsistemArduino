<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulasi Radar 3D</title>
<style>
:root{color-scheme:dark;--bg:#04110a;--fg:#7dffa8;--panel:rgba(0,22,11,.78);--line:#13c46a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#04110a;--fg:#7dffa8;--panel:rgba(0,22,11,.78);--line:#13c46a}}
:root[data-theme="dark"]{--bg:#04110a;--fg:#7dffa8;--panel:rgba(0,22,11,.78);--line:#13c46a}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;overflow:hidden}
#c{position:fixed;inset:0}
canvas{display:block;touch-action:none}
#hud{position:fixed;left:12px;top:calc(10px + env(safe-area-inset-top,0px));background:var(--panel);padding:8px 10px;border-radius:10px;line-height:1.4;pointer-events:none}
#hud small{opacity:.75}
#ui{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--panel)}
button{background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font:inherit}
button:active{background:var(--line);color:var(--bg)}
label{display:flex;align-items:center;gap:6px}
input[type=range]{width:110px;accent-color:var(--line)}
</style>
</head>
<body>
<div id="c"></div>
<div id="hud">Radar 3D · <b id="n">0</b> target terdeteksi<br><small>Geser: putar · cubit/scroll: zoom · cincin: 10/20/30 km</small></div>
<div id="ui">
<button id="b1">Jeda</button>
<button id="b2">+ Target</button>
<button id="b3">Sembunyikan berkas</button>
<label>Putaran <input id="sp" type="range" min="0.2" max="4" step="0.1" value="1.2"></label>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const box=document.getElementById('c');
const R=new THREE.WebGLRenderer({antialias:true});
R.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
box.appendChild(R.domElement);
const S=new THREE.Scene();
S.background=new THREE.Color(0x04110a);
S.fog=new THREE.Fog(0x04110a,55,150);
const cam=new THREE.PerspectiveCamera(55,1,.1,400);
let az=.8,pol=.45,dist=48;
function setCam(){
  cam.position.set(dist*Math.cos(pol)*Math.sin(az),7+dist*Math.sin(pol),dist*Math.cos(pol)*Math.cos(az));
  cam.lookAt(0,7,0);
}
function resize(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

S.add(new THREE.AmbientLight(0x88ffbb,.55));
const dl=new THREE.DirectionalLight(0xffffff,.8);dl.position.set(10,30,20);S.add(dl);
S.add(new THREE.GridHelper(90,30,0x0b8a46,0x063a22));
const GM=new THREE.MeshBasicMaterial({color:0x13c46a,side:THREE.DoubleSide,transparent:true,opacity:.35});
[10,20,30].forEach(r=>{
  const m=new THREE.Mesh(new THREE.RingGeometry(r-.06,r+.06,96),GM);
  m.rotation.x=-Math.PI/2;m.position.y=.02;S.add(m);
});

// Menara + antena
const mat=new THREE.MeshStandardMaterial({color:0x5b6b63,metalness:.4,roughness:.5});
const tw=new THREE.Mesh(new THREE.CylinderGeometry(.8,1.5,6.4,16),mat);tw.position.y=3.2;S.add(tw);
const base=new THREE.Mesh(new THREE.CylinderGeometry(2.4,2.8,.4,24),mat);base.position.y=.2;S.add(base);
const ant=new THREE.Group();ant.position.y=7;S.add(ant);
const ped=new THREE.Mesh(new THREE.CylinderGeometry(.6,.6,1,16),mat);ped.position.y=-.5;ant.add(ped);
const dishMat=new THREE.MeshStandardMaterial({color:0xcfe9db,metalness:.3,roughness:.4,side:THREE.DoubleSide});
const rr=3.6,ca=Math.PI/3.2;
const dish=new THREE.Mesh(new THREE.SphereGeometry(rr,40,20,0,Math.PI*2,Math.PI-ca,ca),dishMat);
dish.scale.set(1.6,1,.6);dish.rotation.x=Math.PI/2;dish.position.z=rr;ant.add(dish);
const horn=new THREE.Mesh(new THREE.CylinderGeometry(.18,.18,.6,12),mat);
horn.rotation.x=Math.PI/2;horn.position.z=1.6;ant.add(horn);
const rod=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,1.6,8),mat);
rod.rotation.x=Math.PI/2;rod.position.z=.8;ant.add(rod);

// Berkas radar (kipas: sempit horizontal, lebar vertikal)
const BL=38,gB=new THREE.ConeGeometry(6,BL,32,1,true);
gB.translate(0,-BL/2,0);
const beam=new THREE.Mesh(gB,new THREE.MeshBasicMaterial({color:0x2dff8a,transparent:true,opacity:.14,side:THREE.DoubleSide,depthWrite:false,blending:THREE.AdditiveBlending}));
beam.rotation.x=-Math.PI/2;beam.scale.set(.5,1,2);ant.add(beam);

// Target
const T=[];
function spawn(t){
  const a=Math.random()*6.283,r=14+Math.random()*20;
  t.p.set(Math.sin(a)*r,3+Math.random()*12,Math.cos(a)*r);
  const h=Math.random()*6.283,s=.8+Math.random()*1.6;
  t.v.set(Math.sin(h)*s,0,Math.cos(h)*s);
}
function addTarget(){
  const m=new THREE.Mesh(new THREE.OctahedronGeometry(.55),new THREE.MeshBasicMaterial({color:0x14553a}));
  const lg=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3()]);
  const ln=new THREE.Line(lg,new THREE.LineBasicMaterial({color:0x7dffa8,transparent:true,opacity:0}));
  ln.frustumCulled=false;
  S.add(m);S.add(ln);
  const t={m,ln,p:m.position,v:new THREE.Vector3(),lit:0};
  spawn(t);T.push(t);
}
for(let i=0;i<7;i++)addTarget();

let spd=1.2,paused=false,phi=0,last=performance.now();
const hudN=document.getElementById('n');
function wrap(a){while(a>Math.PI)a-=6.283185;while(a<-Math.PI)a+=6.283185;return a}
function loop(now){
  const dt=Math.min((now-last)/1000,.05);last=now;
  if(!paused){
    phi-=spd*dt;ant.rotation.y=phi;
    let n=0;
    T.forEach(t=>{
      t.p.addScaledVector(t.v,dt);
      const h=Math.hypot(t.p.x,t.p.z);
      if(h>36||h<4)spawn(t);
      const d=wrap(Math.atan2(t.p.x,t.p.z)-phi),e=Math.atan2(t.p.y-7,h);
      if(Math.abs(d)<.12&&Math.abs(e)<.3&&h<BL)t.lit=1;
      else t.lit=Math.max(0,t.lit-dt/3);
      const L=t.lit;
      t.m.material.color.setRGB(.08+.8*L,.33+.67*L,.23+.5*L);
      t.m.scale.setScalar(1+L*.6);
      t.ln.material.opacity=L*.6;
      const a=t.ln.geometry.attributes.position;
      a.setXYZ(0,t.p.x,t.p.y,t.p.z);a.setXYZ(1,t.p.x,0,t.p.z);a.needsUpdate=true;
      if(L>.05)n++;
    });
    hudN.textContent=n;
  }
  setCam();R.render(S,cam);requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// Kontrol sentuh/mouse
const ps=new Map(),cv=R.domElement;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ps.set(e.pointerId,[e.clientX,e.clientY])});
cv.addEventListener('pointermove',e=>{
  if(!ps.has(e.pointerId))return;
  const o=ps.get(e.pointerId);
  if(ps.size===1){
    az-=(e.clientX-o[0])*.007;
    pol=Math.max(.05,Math.min(1.4,pol+(e.clientY-o[1])*.005));
  }else{
    const o2=[...ps.entries()].find(([k])=>k!==e.pointerId)[1];
    const d0=Math.hypot(o[0]-o2[0],o[1]-o2[1]),d1=Math.hypot(e.clientX-o2[0],e.clientY-o2[1]);
    dist=Math.max(15,Math.min(90,dist*d0/Math.max(d1,1)));
  }
  ps.set(e.pointerId,[e.clientX,e.clientY]);
});
['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,e=>ps.delete(e.pointerId)));
cv.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(15,Math.min(90,dist*(1+e.deltaY*.001)))},{passive:false});

document.getElementById('b1').onclick=e=>{paused=!paused;e.target.textContent=paused?'Lanjut':'Jeda';last=performance.now()};
document.getElementById('b2').onclick=addTarget;
document.getElementById('b3').onclick=e=>{beam.visible=!beam.visible;e.target.textContent=beam.visible?'Sembunyikan berkas':'Tampilkan berkas'};
document.getElementById('sp').oninput=e=>{spd=parseFloat(e.target.value)};
</script>
</body>
</html>
